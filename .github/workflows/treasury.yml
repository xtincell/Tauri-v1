name: Treasury checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factures-recus-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: factures-recus-tauri/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  desktop-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: factures-recus-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: factures-recus-tauri/package-lock.json
      - run: npm ci
      - run: npm run tauri:build -- --bundles app
      - name: Package the app with executable permissions
        run: ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/Factures & Recus.app" factures-recus-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: factures-recus-macos
          path: factures-recus-tauri/factures-recus-macos.zip
          if-no-files-found: error
